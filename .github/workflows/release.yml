name: Release

on:
  push:
    # Only full semver tags. The moving `v1` tag that consumers pin the action
    # to is not a release, and would otherwise try to republish whatever
    # version happened to be in package.json.
    tags: ['v[0-9]+.[0-9]+.[0-9]+', 'v[0-9]+.[0-9]+.[0-9]+-*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      # Required for npm provenance: it is what proves the package was built
      # here, from this commit, rather than on someone's laptop.
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Configure git
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"
          git config --global init.defaultBranch main

      # Trusted publishing needs npm 11.5.1 or newer; the runner ships npm 10.
      - name: Use an npm that can publish through OIDC
        run: npm install -g npm@latest

      - run: npm ci
      - run: npm run build
      - run: npm test

      - name: The tag must match the version in package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag v$tag does not match package.json version $pkg"
            exit 1
          fi

      # No token: npm trusts this repository, this workflow file and this
      # environment through OIDC, and mints a short-lived credential for the
      # run. There is no secret to store, rotate or leak.
      - name: Publish
        run: npm publish --provenance --access public

      - name: Create the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --generate-notes --verify-tag

      # Consumers pin the action to `v1`, so it has to follow the releases. A
      # major tag left behind on an old version is the classic way an action
      # quietly stops matching its own documentation.
      - name: Move the major tag to this release
        if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
        run: |
          major="v${GITHUB_REF_NAME#v}"
          major="${major%%.*}"
          git tag -f "$major" "${GITHUB_REF_NAME}"
          git push -f origin "$major"
