name: Feature request
description: Suggest something regraft should be able to do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that regraft makes hard or impossible?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you have in mind
      description: A command, a config key, a flag — as concrete as you can make it.

  - type: textarea
    id: alternatives
    attributes:
      label: What you do today instead
