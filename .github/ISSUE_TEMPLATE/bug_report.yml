name: Bug report
description: A graft did something it should not have
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. regraft rewrites repositories, so bugs here matter.

        **Never paste a private repository URL or a token.**

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did regraft do, and what did you expect instead?
    validations:
      required: true

  - type: textarea
    id: doctor
    attributes:
      label: Output of `regraft doctor`
      description: Redact any private URLs.
      render: shell
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: Your `.regraft.yml`
      render: yaml
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: |
        Best of all is a short script that builds two throwaway repos sharing no
        history and shows the problem. See `test/helpers/repo.ts` for the shape.
      render: shell

  - type: input
    id: version
    attributes:
      label: regraft version
      description: Output of `regraft --version`
    validations:
      required: true

  - type: input
    id: env
    attributes:
      label: Node and git version
      placeholder: 'node 22.20.0, git 2.43.0, Ubuntu 24.04'
    validations:
      required: true
