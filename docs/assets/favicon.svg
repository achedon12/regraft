<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="regraft">
  <title>regraft</title>
  <!-- The graft: a scion cut in at an angle and joined to a rootstock. The
       host repository is the upright stem, the template's commits are the
       branch coming into it. -->
  <rect width="100" height="100" rx="22" fill="#0d1117"/>
  <g fill="none" stroke-linecap="round" stroke-width="12">
    <path d="M38 86 V18" stroke="#8b949e"/>
    <path d="M82 20 L38 52" stroke="#3fb950"/>
  </g>
  <circle cx="38" cy="52" r="9" fill="#3fb950"/>
</svg>
